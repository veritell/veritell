# NOT YET RUN ON GITHUB: this repository has no remote yet, so this workflow is untested there.
# Fuzzes the veritell-fp parsers (TLS ClientHello, HTTP/2 preamble, HPACK) with cargo-fuzz.
name: fuzz
on:
  push:
    paths:
      - "crates/veritell-fp/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "crates/veritell-fp/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZ_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/veritell-fp/fuzz
      - run: cargo install cargo-fuzz --locked
      # 3 targets x 120 s.
      - run: scripts/fuzz.sh 120
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/veritell-fp/fuzz/artifacts/
          if-no-files-found: ignore
