# The fast suite (./test.sh: fixed contracts, cargo test, rollout-kit tests)
# and the probe checks that need no browser. Browser-driven runs are in lab.yml.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # BoringSSL (pulled in by Pingora) needs cmake and a C/C++ toolchain;
      # bindgen needs libclang. test.sh also needs openssl 3 and python3.
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - name: test.sh
        run: ./test.sh
      - name: Probe scripts parse
        run: |
          node --check probe/probe.js
          node --check probe/behavior.js
      - name: Probe reports match the schema
        run: |
          for f in probe/test/captured-*.json; do
            node probe/validate.mjs "$f"
          done
