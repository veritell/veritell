# The gateway in front of any site (redirect and port modes), plus the event
# store. See deploy/README.md. The gateway runs on the host's network: it sees
# the real client address, reaches the site on 127.0.0.1, and needs no Docker
# network of the site's. Run from the kit's folder with
#   docker compose --env-file kit.env -f compose.host.yml up -d
# where kit.env is written by install.sh and changed by cutover.sh and
# rollback.sh only (VERITELL_LISTEN, VERITELL_FRONT).
name: veritell

services:
  gateway:
    image: veritell:${VERITELL_TAG:-latest}
    container_name: veritell-gateway
    network_mode: host
    # The image's ENTRYPOINT passes --listen 0.0.0.0:8443; the last --listen
    # wins, so this one does.
    command:
      - --listen
      - ${VERITELL_LISTEN:?written by install.sh}
      - --upstream
      - ${UPSTREAM:?set UPSTREAM in site.conf, e.g. 127.0.0.1:443}
      - --upstream-tls
      - ${UPSTREAM_TLS:-on}
      - --upstream-sni
      - ${SITE_HOST:?set SITE_HOST in site.conf}
      # Other sites on this host: certificates by name (EXTRA_CERT_NAMES in
      # site.conf, copied to certs/sni) and the upstream for each name
      # (HOST_UPSTREAMS). Both empty unless set; empty means none.
      - --sni-dir
      - ${SNI_DIR:-}
      - --upstream-host
      - ${HOST_UPSTREAMS:-}
      # The CA that signs the site's certificate (UPSTREAM_CA in site.conf),
      # or empty for the system roots.
      - --upstream-ca
      - ${VERITELL_UPSTREAM_CA:-}
      # The origin gets only the address the gateway saw, in X-Forwarded-For
      # and X-Real-IP; anything the client wrote there is dropped (a server
      # that reads the header from the left, like Caddy before 2.8, would
      # otherwise trust a spoofed address).
      - --forwarded-for
      - replace
      - --policy
      - /etc/veritell/policy.yaml
      # Which network each address belongs to (asn.sh, weekly); empty, before
      # the first download or with ASN_DB=off, means none.
      - --asn-db
      - ${VERITELL_ASN_DB:-}
      # Web Bot Auth agents the operator trusts (agents/agents.json, see
      # README.md); empty when there is no such file, which means none.
      - --wba-agents
      - ${VERITELL_WBA_AGENTS:-}
      - --ip-mode
      - keyed
      - --state-dir
      - /state
      - --clickhouse-url
      - http://127.0.0.1:18123
      - --clickhouse-user
      - veritell
      # The probe and behaviour scripts in the site's pages, so that shadow
      # mode learns about browsers from the inside too. Quoted: YAML would
      # read a bare on as true.
      - --inject-probe
      - "on"
      # No line per visitor in the container's log: Docker rotates it by
      # size only, so on a quiet site it would outlive the store's 30 days.
      # The events are in ClickHouse.
      - --log-requests
      - "off"
      # The dashboard, on the host's loopback only, reached with an SSH
      # tunnel. Needs VERITELL_ADMIN_TOKEN (gateway.env).
      - --admin
      - 127.0.0.1:9090
    # VERITELL_SECRET, VERITELL_KNOWN_KEY, VERITELL_CLICKHOUSE_PASSWORD,
    # VERITELL_ADMIN_TOKEN.
    env_file: gateway.env
    volumes:
      - ./certs:/certs:ro
      - ./state:/state
      - ./policy.yaml:/etc/veritell/policy.yaml:ro
      - ./asn:/etc/veritell/asn:ro
      - ./agents:/etc/veritell/agents:ro
      # The CA that signs the site's certificate, when UPSTREAM_CA is set
      # (an empty file otherwise, which nothing reads).
      - ./upstream-ca.pem:/etc/veritell/upstream-ca.pem:ro
    # Started once the store answers, so the first events are not dropped.
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    # SIGTERM saves the state (see crates/veritell-proxy/src/state.rs).
    stop_grace_period: 10s
    # Least privilege: only NET_BIND_SERVICE, for port 443 in port mode. The
    # image grants it to the binary as a file capability, and Linux refuses
    # to run that binary when the container cannot grant it, so
    # no-new-privileges stays off too. The
    # gateway writes only to /state.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    # A ceiling, so a leak or a flood takes down the gateway (which Docker
    # restarts) and not the other containers on the host. The gateway uses
    # about 110 to 160 MiB with the ASN database; VERITELL_MEM_LIMIT in
    # kit.env changes it.
    mem_limit: ${VERITELL_MEM_LIMIT:-512m}
    # Up when the dashboard answers HTTP and the proxy port takes a
    # connection. The image has bash but no curl. Status only: Docker does
    # not restart an unhealthy container (status.sh shows it).
    healthcheck:
      test: ["CMD", "bash", "-c", "p='${VERITELL_LISTEN}'; exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && read -t 3 -r l <&3 && [[ $$l == HTTP/* ]] && exec 4<>/dev/tcp/127.0.0.1/$${p##*:}"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: veritell-clickhouse
    environment:
      CLICKHOUSE_DB: veritell
      CLICKHOUSE_USER: veritell
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?written by install.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      # Runs once, on an empty data folder: the events table.
      - ./clickhouse/events.sql:/docker-entrypoint-initdb.d/events.sql:ro
    # On the host's loopback only, for the gateway (which is on the host's
    # network) and for docker exec.
    ports:
      - "127.0.0.1:18123:8123"
    networks: [store]
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

networks:
  store: {}

volumes:
  clickhouse: {}
