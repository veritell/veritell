# The gateway in front of a site run with Docker Compose, plus the event
# store. See deploy/README.md. Run from the kit's folder on the host with
#   docker compose --env-file kit.env -f compose.yml up -d
# where kit.env is written by install.sh and changed by cutover.sh and
# rollback.sh only.
name: veritell

services:
  gateway:
    image: veritell:${VERITELL_TAG:-latest}
    container_name: veritell-gateway
    command:
      - --upstream
      - ${SITE_UPSTREAM:?set SITE_UPSTREAM, e.g. web:8081}
      # Other sites on this host: certificates by name (EXTRA_CERT_NAMES in
      # site.conf, copied to certs/sni) and the upstream for each name
      # (HOST_UPSTREAMS). Both empty unless set; empty means none.
      - --sni-dir
      - ${SNI_DIR:-}
      - --upstream-host
      - ${HOST_UPSTREAMS:-}
      - --policy
      - /etc/veritell/policy.yaml
      - --ip-mode
      - keyed
      - --state-dir
      - /state
      - --clickhouse-url
      - http://clickhouse:8123
      - --clickhouse-user
      - veritell
      # The probe and behaviour scripts in the site's pages, so that shadow
      # mode learns about browsers from the inside too. Quoted: YAML would
      # read a bare on as true.
      - --inject-probe
      - "on"
      # No line per visitor in the container's log: Docker rotates it by
      # size only, so on a quiet site it would outlive the store's 30 days.
      # The events are in ClickHouse.
      - --log-requests
      - "off"
      # The dashboard. Every address inside the container, so that the host
      # reaches it; published on the host's loopback only (below), reached
      # with an SSH tunnel. Needs VERITELL_ADMIN_TOKEN (gateway.env).
      - --admin
      - 0.0.0.0:9090
    # VERITELL_SECRET, VERITELL_KNOWN_KEY, VERITELL_CLICKHOUSE_PASSWORD,
    # VERITELL_ADMIN_TOKEN.
    env_file: gateway.env
    ports:
      # 127.0.0.1:9443 before the cutover (checks only); 443 after it.
      - "${VERITELL_PUBLISH:-127.0.0.1:9443}:8443"
      # The dashboard: keep it on a loopback address.
      - "${VERITELL_ADMIN_PUBLISH:-127.0.0.1:9090}:9090"
    volumes:
      - ./certs:/certs:ro
      - ./state:/state
      - ./policy.yaml:/etc/veritell/policy.yaml:ro
    networks: [site, store]
    # Started once the store answers, so the first events are not dropped.
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    # SIGTERM saves the state (see crates/veritell-proxy/src/state.rs).
    stop_grace_period: 10s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: veritell-clickhouse
    environment:
      CLICKHOUSE_DB: veritell
      CLICKHOUSE_USER: veritell
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?written by install.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      # Runs once, on an empty data folder: the events table.
      - ./clickhouse/events.sql:/docker-entrypoint-initdb.d/events.sql:ro
    # Not published: only the gateway (and docker exec) reach it.
    networks: [store]
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

networks:
  # The site's own network, where its web container answers on SITE_UPSTREAM.
  site:
    external: true
    name: ${SITE_NETWORK:?set SITE_NETWORK, e.g. mysite_default}
  store: {}

volumes:
  clickhouse: {}
