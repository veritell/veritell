# Example nginx configuration for Veritell sidecar mode (see sidecar/README.md).
# It is an example to adapt. It listens on 127.0.0.1:8000, asks the sidecar
# endpoint before serving each request (auth_request), and proxies to the
# upstream on 127.0.0.1:8080.
#
# Needs the auth_request module (included in the standard nginx builds).
# Start the gateway with:
#   --sidecar-listen 127.0.0.1:9191 --trusted-proxy 127.0.0.1

events {}

http {
    upstream veritell_upstream {
        server 127.0.0.1:8080;
    }

    server {
        listen 127.0.0.1:8000;
        server_name _;

        # Gateway pages (probe, behaviour script, challenge) are served by the
        # gateway's main listener, without the sidecar check. That listener is
        # HTTPS with its own certificate; proxy_ssl_verify off is for this
        # local example only.
        location /__veritell/ {
            proxy_pass https://127.0.0.1:8443;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Internal subrequest to the sidecar endpoint. Clients cannot reach it.
        location = /_veritell_authz {
            internal;
            proxy_pass http://127.0.0.1:9191/__veritell/authz;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # The X-Forwarded-* copies overwrite any a client sent: the
            # endpoint refuses a call where the two disagree.
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-Method $request_method;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            auth_request /_veritell_authz;

            # Values from the 200 answer. An empty value makes proxy_set_header
            # omit the header, so a client-supplied X-Veritell-* header is not
            # passed on unless the gateway set it. nginx cannot drop headers by
            # prefix: every X-Veritell-* name the gateway uses is listed, and
            # the ones it never sets in sidecar mode are set empty.
            auth_request_set $veritell_score      $upstream_http_x_veritell_score;
            auth_request_set $veritell_class      $upstream_http_x_veritell_class;
            auth_request_set $veritell_detections $upstream_http_x_veritell_detections;
            auth_request_set $veritell_action     $upstream_http_x_veritell_action;
            auth_request_set $veritell_receipt    $upstream_http_x_veritell_receipt;

            proxy_set_header X-Veritell-Score      $veritell_score;
            proxy_set_header X-Veritell-Class      $veritell_class;
            proxy_set_header X-Veritell-Detections $veritell_detections;
            proxy_set_header X-Veritell-Action     $veritell_action;
            # "unverified" when the request claims a payment receipt; the
            # origin checks the receipt itself.
            proxy_set_header X-Veritell-Receipt    $veritell_receipt;
            proxy_set_header X-Veritell-Token      "";
            proxy_set_header X-Veritell-Ja4        "";
            proxy_set_header X-Veritell-H2         "";

            # Answers from the sidecar endpoint, as nginx's auth_request handles them:
            #   200  pass; the headers above are set.
            #   403  nginx answers 403. The README's redirect to
            #        /__veritell/challenge for X-Veritell-Action: challenge(...)
            #        is NOT done by this example.
            #        A charge(<offer>) rule also answers 403, with
            #        X-Veritell-Action: charge and the offer in Veritell-Offer;
            #        this example does not pass those on to the client.
            #   401  nginx answers 401 (the endpoint does not send it).
            #   429  NOT surfaced. auth_request accepts only 2xx, 401 and 403 from
            #        the auth server; any other status becomes a 500 for the client.
            #        Passing 429 through needs extra configuration this example
            #        does not have, so throttled clients see 500, not 429.
            #   400  also becomes a 500. Treat as a misconfiguration (it is one).
            proxy_pass http://veritell_upstream;
        }
    }
}
