# Example Envoy v3 static configuration for Veritell sidecar mode (see sidecar/README.md).
# It is an example to adapt. It listens on 127.0.0.1:8000, calls the sidecar
# endpoint with ext_authz (HTTP service) for each request, and proxies to the
# upstream on 127.0.0.1:8080.
#
# Start the gateway with:
#   --sidecar-listen 127.0.0.1:9191 --trusted-proxy 127.0.0.1
# Run this file with:
#   envoy -c sidecar/envoy.yaml

static_resources:
  listeners:
  - name: veritell_ingress
    address:
      socket_address: { address: 127.0.0.1, port_value: 8000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: veritell_ingress
          codec_type: AUTO
          # Make Envoy append the client's address to x-forwarded-for. Without
          # this the endpoint gets no client address and answers 400.
          use_remote_address: true
          xff_num_trusted_hops: 0
          route_config:
            name: local_route
            virtual_hosts:
            - name: local
              domains: ["*"]
              routes:
              # Gateway pages: ext_authz is switched off for this route.
              - match: { prefix: "/__veritell/" }
                route: { cluster: veritell_gateway }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match: { prefix: "/" }
                route: { cluster: upstream }
          http_filters:
          # Drops client-sent X-Veritell-* headers before ext_authz adds the
          # gateway's: a header missing from the answer would otherwise reach
          # the upstream as the client wrote it. (Needs Envoy 1.27 or later.)
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                request_mutations:
                - remove: x-veritell-score
                - remove: x-veritell-class
                - remove: x-veritell-detections
                - remove: x-veritell-action
                - remove: x-veritell-receipt
                - remove: x-veritell-token
                - remove: x-veritell-ja4
                - remove: x-veritell-h2
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              http_service:
                server_uri:
                  uri: 127.0.0.1:9191
                  cluster: veritell_authz
                  timeout: 1s
                # Envoy appends the original path: /__veritell/authz/<path>,
                # which the README says the endpoint accepts.
                path_prefix: /__veritell/authz
                authorization_request:
                  # Client headers the README lists (lowercase), plus x-forwarded-for.
                  allowed_headers:
                    patterns:
                    - exact: user-agent
                    - exact: cookie
                    - exact: accept-language
                    - prefix: sec-ch-ua
                    - prefix: sec-fetch-
                    - exact: signature
                    - exact: signature-input
                    - exact: signature-agent
                    - exact: x-forwarded-for
                authorization_response:
                  # The answer headers copied to the upstream request.
                  allowed_upstream_headers:
                    patterns:
                    - exact: x-veritell-score
                    - exact: x-veritell-class
                    - exact: x-veritell-detections
                    - exact: x-veritell-action
                    # "unverified" when the request claims a payment receipt.
                    - exact: x-veritell-receipt
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: veritell_authz
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: veritell_authz
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 9191 }

  - name: upstream
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8080 }

  - name: veritell_gateway
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: veritell_gateway
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        # No certificate validation: local example only.
        # Not verified against a running gateway.
