[package]
name = "veritell-proxy"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[[bin]]
name = "veritell"
path = "src/main.rs"

[dependencies]
veritell-core.workspace = true
veritell-fp.workspace = true
veritell-ua.workspace = true
veritell-identity.workspace = true
veritell-policy.workspace = true
veritell-token.workspace = true
veritell-wba.workspace = true
veritell-probe.workspace = true
veritell-events.workspace = true
veritell-dash.workspace = true
veritell-feed.workspace = true
veritell-probe-build.workspace = true
veritell-behavior.workspace = true
veritell-agg.workspace = true
veritell-model.workspace = true
veritell-quota.workspace = true
veritell-persist.workspace = true
hmac = "0.12"
sha2.workspace = true
veritell-directory.workspace = true
veritell-privacypass.workspace = true
veritell-share.workspace = true
base64 = "0.22"
http = "1"
pingora = { version = "0.9.1", features = ["boringssl", "proxy"] }
boring = "5"
async-trait.workspace = true
tokio = { workspace = true, features = ["time", "rt"] }
bytes = "1"
serde_json.workspace = true
serde.workspace = true
dns-lookup = "4"
getrandom = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["time", "rt", "macros", "test-util"] }
ed25519-dalek = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
