<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checking your browser</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fb;--ink:#15202b;--soft:#4a5866;--marker:#f5cf3a;--stop:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#121a22;--ink:#e6ecf1;--soft:#9fb0bf;--marker:#e8c22f;--stop:#e07a66}}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink)}
main{max-width:26rem;padding:1.5rem;display:grid;justify-items:center;text-align:center;gap:.9rem}
h1{font-family:Charter,"Iowan Old Style",Cambria,Georgia,serif;font-size:1.45rem;margin:0}
p{line-height:1.5;margin:0;color:var(--soft)}
#status{font-size:.9rem;min-height:1.4em;font-variant-numeric:tabular-nums}
.source{font-size:.8rem}
.source a{color:var(--soft)}
/* The Veritell mark: an ink stroke over a highlighter swipe. The ink is drawn
   down to the point of the V, then the highlighter swipes back up from it. */
.mark{width:96px;height:96px;overflow:visible}
.mark .ink{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-dasharray:1 2;stroke-dashoffset:1.05}
.mark .hl{fill:var(--marker)}
.mark .reveal{fill:none;stroke:#fff;stroke-width:15;stroke-dasharray:1 2;stroke-dashoffset:1}
.mark .both{transform-origin:32px 50px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font:600 .8rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;text-transform:uppercase}
.checks li{position:relative;padding:5px 9px;color:var(--soft)}
.checks li::before{content:"";position:absolute;inset:2px 0;background:var(--marker);clip-path:inset(0 100% 0 0);border-radius:2px}
.checks span{position:relative}
[data-state=working] .ink{animation:ink 2.6s cubic-bezier(.6,0,.3,1) infinite}
[data-state=working] .reveal{animation:swipe 2.6s cubic-bezier(.5,0,.2,1) infinite}
[data-state=working] .both{animation:hold 2.6s ease-in-out infinite}
[data-state=working] .checks li::before{animation:tick 2.7s ease-in-out infinite}
[data-state=working] .checks li:nth-child(2)::before{animation-delay:.9s}
[data-state=working] .checks li:nth-child(3)::before{animation-delay:1.8s}
@keyframes ink{0%{stroke-dashoffset:1.05}28%,100%{stroke-dashoffset:0}}
@keyframes swipe{0%,24%{stroke-dashoffset:1}52%,100%{stroke-dashoffset:0}}
@keyframes hold{0%,80%{opacity:1;transform:scale(1)}96%{opacity:0;transform:scale(.97)}100%{opacity:0}}
@keyframes tick{0%{clip-path:inset(0 100% 0 0)}18%,30%{clip-path:inset(0 0 0 0)}48%,100%{clip-path:inset(0 0 0 100%)}}
/* Done: an animation, not a transition, so the mark is drawn even when the
   proof of work is found before the first paint (most visitors). */
[data-state=done] .ink{animation:draw-ink .45s cubic-bezier(.6,0,.3,1) both}
[data-state=done] .reveal{animation:draw-swipe .45s cubic-bezier(.5,0,.2,1) .3s both}
[data-state=done] .both{animation:settle .5s ease-out .8s both}
@keyframes draw-ink{from{stroke-dashoffset:1.05}to{stroke-dashoffset:0}}
@keyframes draw-swipe{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes settle{45%{transform:scale(1.06)}}
/* Each label turns to ink as its highlight arrives, not before: dark ink on
   the dark page would be unreadable until then. */
[data-state=done] .checks li{animation:ink-on .3s step-end .5s both}
[data-state=done] .checks li::before{animation:mark-in .3s ease-out .5s both}
[data-state=done] .checks li:nth-child(2),[data-state=done] .checks li:nth-child(2)::before{animation-delay:.62s}
[data-state=done] .checks li:nth-child(3),[data-state=done] .checks li:nth-child(3)::before{animation-delay:.74s}
@keyframes mark-in{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ink-on{from{color:var(--soft)}50%,to{color:#15202b}}
[data-state=failed] .ink{stroke-dashoffset:0;stroke:var(--soft)}
[data-state=failed] .checks li:nth-child(3) span{text-decoration:line-through 2px var(--stop)}
@media (prefers-reduced-motion:reduce){
.mark .ink,.mark .reveal,.mark .both,.checks li::before{animation:none!important;transition:none!important}
.mark .ink{stroke-dashoffset:0}
[data-state=working] .reveal,[data-state=done] .reveal{stroke-dashoffset:0}
[data-state=working] .hl{opacity:.5}
[data-state=done] .checks li::before{clip-path:inset(0 0 0 0)}
[data-state=done] .checks li{animation:none!important;color:#15202b}
}
</style>
</head>
<body>
<main id="main" data-state="working">
<svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
<defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><path class="reveal" pathLength="1" d="M31.7 54 L49.3 10"/></mask></defs>
<g class="both"><path class="hl" mask="url(#m)" d="M44.5 12 L52.5 12 L36.5 52 L28.5 52 Z"/><path class="ink" pathLength="1" d="M14 14 L32 50"/></g>
</svg>
<h1>Checking your browser</h1>
<p>This check is automatic and takes a moment. You will be sent on to the page you asked for.</p>
<ol class="checks" aria-hidden="true"><li><span>Connection</span></li><li><span>Browser</span></li><li><span>Proof of work</span></li></ol>
<p id="status" role="status" aria-live="polite">Working...</p>
<form id="f" method="post" action="/__veritell/verify" data-difficulty="{{SLOT}}">
<input type="hidden" id="challenge" name="challenge" value="{{SLOT}}">
<input type="hidden" id="counter" name="counter" value="">
<input type="hidden" id="return_to" name="return_to" value="{{SLOT}}">
</form>
<noscript><p>JavaScript is required to continue. Please enable it and reload this page.</p></noscript>
</main>
<script>
(function () {
  var form = document.getElementById('f');
  var status = document.getElementById('status');
  var main = document.getElementById('main');
  function state(s) { main.setAttribute('data-state', s); }
  var difficulty = parseInt(form.getAttribute('data-difficulty'), 10) || 0;
  var challenge = document.getElementById('challenge').value;
  if (!window.crypto || !window.crypto.subtle) {
    state('failed');
    status.textContent = 'This check needs a secure (HTTPS) connection and a current browser. It cannot run here.';
    return;
  }
  var enc = new TextEncoder();
  function zeroBits(bytes) {
    var n = 0;
    for (var i = 0; i < bytes.length; i++) {
      if (bytes[i] === 0) { n += 8; continue; }
      n += Math.clz32(bytes[i]) - 24;
      break;
    }
    return n;
  }
  async function solve() {
    var counter = 0;
    for (;;) {
      for (var i = 0; i < 300; i++, counter++) {
        var d = await crypto.subtle.digest('SHA-256', enc.encode(challenge + ':' + counter));
        if (zeroBits(new Uint8Array(d)) >= difficulty) { return counter; }
      }
      status.textContent = 'Working... ' + counter + ' attempts';
      await new Promise(function (r) { setTimeout(r, 0); });
    }
  }
  // When the gateway adds its probe script to this page it marks the root
  // element. Give the probe a moment to report before leaving the page.
  var probed = new Promise(function (resolve) {
    if (!document.documentElement.hasAttribute('data-probe')) { resolve(); return; }
    document.addEventListener('veritell:done', function () { resolve(); });
    setTimeout(resolve, 4000);
  });
  // When the gateway also asked for a Privacy Pass token it may set
  // `data-wait` (milliseconds): a browser that holds a token reloads the
  // page with it, and leaving at once would cut that reload short.
  var wait = parseInt(document.documentElement.getAttribute('data-wait'), 10) || 0;
  var waited = new Promise(function (resolve) { setTimeout(resolve, Math.min(Math.max(wait, 0), 5000)); });
  // Let the mark be drawn in full, so a fast solve doesn't flash past.
  var shown = new Promise(function (resolve) { setTimeout(resolve, 1500); });
  solve().then(function (counter) {
    document.getElementById('counter').value = String(counter);
    state('done');
    status.textContent = 'Done. Continuing...';
    Promise.all([probed, waited, shown]).then(function () { form.submit(); });
  }, function () {
    state('failed');
    status.textContent = 'The check failed. Please reload the page.';
  });
})();
</script>
</body>
</html>
