[package]
name = "veritell-fp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
loona-hpack = "0.4"

[dependencies.veritell-fp]
path = ".."

# Keep this crate out of the root workspace.
[workspace]

[[bin]]
name = "tls_clienthello"
path = "fuzz_targets/tls_clienthello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_parse"
path = "fuzz_targets/h2_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack_decode"
path = "fuzz_targets/hpack_decode.rs"
test = false
doc = false
bench = false
